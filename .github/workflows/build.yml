name: "Build WAJetsam-ServiceExtensionFix"

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: wajetsam-serviceextensionfix-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate settings icon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          data = base64.b64decode(Path('assets/WAJetsamServiceExtensionFix.png.b64').read_text().strip())
          targets = [
              Path('layout/Library/PreferenceLoader/Preferences/WAJetsamServiceExtensionFix.png'),
              Path('WatusiServiceFixPrefs/Resources/icon.png'),
          ]
          for target in targets:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          PY

      - name: Verify clean source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^Package: com.551.wajetsamserviceextensionfix$' control
          grep -q '^Name: WAJetsam-ServiceExtensionFix$' control
          grep -q '^Version: 1.8.1$' control
          grep -q '^Homepage: https://github.com/551UK/WAJetsam-ServiceExtensionFix$' control
          grep -q '#define WSD_TARGET_LIMIT_MB 40' policy.h
          grep -q 'checkExpiryDate' ExpiryFix.m
          grep -q 'libWatusiTools' ExpiryFix.m
          grep -q 'WEF_ARM64_BLR_X19' ExpiryFix.m
          grep -q 'MSHookMemory' ExpiryFix.m
          grep -q 'com.551.wajetsamserviceextensionfix' ExpiryFix.m
          grep -q 'finish reboot' layout/DEBIAN/postinst
          grep -q 'GitHub Repository' WatusiServiceFixPrefs/WSFRootListController.m
          grep -q 'https://github.com/551UK/WAJetsam-ServiceExtensionFix' WatusiServiceFixPrefs/WSFRootListController.m
          ! grep -q 'WatusiExpiryFix.log' ExpiryFix.m
          ! test -e Trace.m
          ! test -e observer.c
          ! test -e report.m
          ! test -e status.c
          plutil -lint WatusiExpiryFix.plist
          plutil -lint WatusiServiceDiag.plist
          plutil -lint WatusiServiceFixPrefs/Info.plist
          plutil -lint layout/Library/PreferenceLoader/Preferences/WAJetsamServiceExtensionFix.plist

      - name: Test 40 MB policy
        shell: bash
        run: |
          set -euo pipefail
          cc -Wall -Wextra -Werror tests/test_policy.c -o "$RUNNER_TEMP/wajetsam-policy-test"
          "$RUNNER_TEMP/wajetsam-policy-test"

      - name: Install Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks

      - name: Install Debian packaging tools
        run: brew install dpkg

      - name: Build rootless DEB
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .theos packages
          WSD_DPKG_WRAPPER="$RUNNER_TEMP/wajetsam-dpkg-deb"
          cat > "$WSD_DPKG_WRAPPER" <<'SH'
          #!/bin/sh
          exec dpkg-deb --root-owner-group "$@"
          SH
          chmod +x "$WSD_DPKG_WRAPPER"

          THEOS_PACKAGE_SCHEME=rootless make clean
          THEOS_PACKAGE_SCHEME=rootless \
          THEOS_PLATFORM_DEB_COMPRESSION_TYPE=gzip \
          THEOS_PLATFORM_DEB_COMPRESSION_LEVEL=6 \
          make package FINALPACKAGE=1 \
          _THEOS_PLATFORM_DPKG_DEB="$WSD_DPKG_WRAPPER"

          DEB=$(find packages -type f -name '*.deb' | head -n 1)
          test -n "$DEB"
          test "$(dpkg-deb -f "$DEB" Architecture)" = 'iphoneos-arm64'
          test "$(dpkg-deb -f "$DEB" Package)" = 'com.551.wajetsamserviceextensionfix'
          test "$(dpkg-deb -f "$DEB" Version)" = '1.8.1'
          test "$(dpkg-deb -f "$DEB" Name)" = 'WAJetsam-ServiceExtensionFix'

          VERIFY_DIR="$RUNNER_TEMP/wajetsam-package-check"
          CONTROL_DIR="$RUNNER_TEMP/wajetsam-control-check"
          mkdir -p "$VERIFY_DIR" "$CONTROL_DIR"
          dpkg-deb -x "$DEB" "$VERIFY_DIR"
          dpkg-deb -e "$DEB" "$CONTROL_DIR"

          ROOT="$VERIFY_DIR/var/jb"
          test -f "$ROOT/Library/MobileSubstrate/DynamicLibraries/WatusiServiceDiag.dylib"
          test -f "$ROOT/Library/MobileSubstrate/DynamicLibraries/WatusiServiceDiag.plist"
          test -f "$ROOT/Library/MobileSubstrate/DynamicLibraries/WatusiExpiryFix.dylib"
          test -f "$ROOT/Library/MobileSubstrate/DynamicLibraries/WatusiExpiryFix.plist"
          test -d "$ROOT/Library/PreferenceBundles/WatusiServiceFixPrefs.bundle"
          test -f "$ROOT/Library/PreferenceLoader/Preferences/WAJetsamServiceExtensionFix.plist"
          test -f "$ROOT/Library/PreferenceLoader/Preferences/WAJetsamServiceExtensionFix.png"
          test -x "$CONTROL_DIR/postinst"
          grep -q 'finish reboot' "$CONTROL_DIR/postinst"

          ! test -e "$ROOT/Library/MobileSubstrate/DynamicLibraries/WatusiServiceTrace.dylib"
          ! test -e "$ROOT/usr/bin/watusidiag-observer"
          ! test -e "$ROOT/usr/bin/watusidiag-report"
          ! test -e "$ROOT/usr/bin/watusidiag-status"
          ! test -e "$ROOT/usr/bin/watusidiag-collect"

          lipo "$ROOT/Library/MobileSubstrate/DynamicLibraries/WatusiServiceDiag.dylib" -verify_arch arm64 arm64e
          lipo "$ROOT/Library/MobileSubstrate/DynamicLibraries/WatusiExpiryFix.dylib" -verify_arch arm64 arm64e
          shasum -a 256 "$DEB"

      - name: Upload compiled DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: WAJetsam-ServiceExtensionFix-rootless-DEB
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(awk '/^Version:/ {print $2}' control)
          TAG="v${VERSION}"
          DEB=$(find packages -type f -name '*.deb' | head -n 1)
          test -n "$DEB"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" \
              --target "${GITHUB_SHA}" \
              --title "WAJetsam-ServiceExtensionFix ${VERSION}" \
              --notes-file RELEASE_NOTES.md
          fi
