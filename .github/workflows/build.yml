name: "Build WAJetsam-ServiceExtensionFix"

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: wajetsam-serviceextensionfix-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify clean source and Settings resources
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^Package: com.551.wajetsamserviceextensionfix$' control
          grep -q '^Name: WAJetsam-ServiceExtensionFix$' control
          grep -q '^Version: 2.0$' control
          grep -q '^Homepage: https://github.com/551UK/WAJetsam-ServiceExtensionFix$' control
          grep -q '#define WAJ_TARGET_LIMIT_MB 40' WAJetsamPolicy.h
          grep -q 'checkExpiryDate' WatusiExpiryFix.m
          grep -q 'libWatusiTools' WatusiExpiryFix.m
          grep -q 'WEF_ARM64_BLR_X19' WatusiExpiryFix.m
          grep -q 'MSHookMemory' WatusiExpiryFix.m
          grep -q 'com.551.wajetsamserviceextensionfix' WatusiExpiryFix.m
          grep -q 'finish reboot' layout/DEBIAN/postinst
          grep -q 'GitHub Repository' WAJetsamServiceExtensionFixPrefs/WAJRootListController.m
          grep -q 'https://github.com/551UK/WAJetsam-ServiceExtensionFix' WAJetsamServiceExtensionFixPrefs/WAJRootListController.m

          ! grep -q 'WatusiExpiryFix.log' WatusiExpiryFix.m
          ! test -e Trace.m
          ! test -e observer.c
          ! test -e report.m
          ! test -e status.c
          ! test -e WatusiServiceFixPrefs
          ! test -e WatusiServiceDiag.plist
          ! test -e ExpiryFix.m
          ! test -e Tweak.x
          ! test -e libproc.h
          ! test -e policy.h
          ! test -e tests/test_policy.c

          plutil -lint WatusiExpiryFix.plist
          plutil -lint WAJetsamServiceExtensionFix.plist
          plutil -lint WAJetsamServiceExtensionFixPrefs/Info.plist
          plutil -lint layout/Library/PreferenceLoader/Preferences/WAJetsamServiceExtensionFix.plist

          ENTRY="layout/Library/PreferenceLoader/Preferences/WAJetsamServiceExtensionFix.plist"
          grep -q '<string>WAJetsamServiceExtensionFixPrefs</string>' "$ENTRY"
          grep -q '<string>WAJRootListController</string>' "$ENTRY"
          grep -q '<string>icon.png</string>' "$ENTRY"
          ! grep -q '<key>controller</key>' "$ENTRY"
          ! grep -q '<key>iconImage</key>' "$ENTRY"
          ! grep -q '/var/jb/' "$ENTRY"

          test -s WAJetsamServiceExtensionFixPrefs/Resources/icon.png
          test -s WAJetsamServiceExtensionFixPrefs/Resources/icon@2x.png
          test -s WAJetsamServiceExtensionFixPrefs/Resources/icon@3x.png

          python3 - <<'PY'
          import struct
          from pathlib import Path

          expected = {
              Path('WAJetsamServiceExtensionFixPrefs/Resources/icon.png'): (29, 29),
              Path('WAJetsamServiceExtensionFixPrefs/Resources/icon@2x.png'): (58, 58),
              Path('WAJetsamServiceExtensionFixPrefs/Resources/icon@3x.png'): (87, 87),
          }
          for path, size in expected.items():
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', path
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == size, (path, width, height, size)
          PY

      - name: Test 40 MB policy
        shell: bash
        run: |
          set -euo pipefail
          cc -Wall -Wextra -Werror tests/test_jetsam_policy.c -o "$RUNNER_TEMP/wajetsam-policy-test"
          "$RUNNER_TEMP/wajetsam-policy-test"

      - name: Install Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks

      - name: Install Debian packaging tools
        run: brew install dpkg

      - name: Build rootless DEB
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .theos packages
          DPKG_WRAPPER="$RUNNER_TEMP/wajetsam-dpkg-deb"
          cat > "$DPKG_WRAPPER" <<'SH'
          #!/bin/sh
          exec dpkg-deb --root-owner-group "$@"
          SH
          chmod +x "$DPKG_WRAPPER"

          THEOS_PACKAGE_SCHEME=rootless make clean
          THEOS_PACKAGE_SCHEME=rootless \
          THEOS_PLATFORM_DEB_COMPRESSION_TYPE=gzip \
          THEOS_PLATFORM_DEB_COMPRESSION_LEVEL=6 \
          make package FINALPACKAGE=1 \
          _THEOS_PLATFORM_DPKG_DEB="$DPKG_WRAPPER"

          DEB=$(find packages -type f -name '*.deb' | head -n 1)
          test -n "$DEB"
          test "$(dpkg-deb -f "$DEB" Architecture)" = 'iphoneos-arm64'
          test "$(dpkg-deb -f "$DEB" Package)" = 'com.551.wajetsamserviceextensionfix'
          test "$(dpkg-deb -f "$DEB" Version)" = '2.0'
          test "$(dpkg-deb -f "$DEB" Name)" = 'WAJetsam-ServiceExtensionFix'

          VERIFY_DIR="$RUNNER_TEMP/wajetsam-package-check"
          CONTROL_DIR="$RUNNER_TEMP/wajetsam-control-check"
          rm -rf "$VERIFY_DIR" "$CONTROL_DIR"
          mkdir -p "$VERIFY_DIR" "$CONTROL_DIR"
          dpkg-deb -x "$DEB" "$VERIFY_DIR"
          dpkg-deb -e "$DEB" "$CONTROL_DIR"

          ROOT="$VERIFY_DIR/var/jb"
          DYLIB_DIR="$ROOT/Library/MobileSubstrate/DynamicLibraries"
          PREF_BUNDLE="$ROOT/Library/PreferenceBundles/WAJetsamServiceExtensionFixPrefs.bundle"
          PREF_ENTRY="$ROOT/Library/PreferenceLoader/Preferences/WAJetsamServiceExtensionFix.plist"

          test -f "$DYLIB_DIR/WAJetsamServiceExtensionFix.dylib"
          test -f "$DYLIB_DIR/WAJetsamServiceExtensionFix.plist"
          test -f "$DYLIB_DIR/WatusiExpiryFix.dylib"
          test -f "$DYLIB_DIR/WatusiExpiryFix.plist"
          test -d "$PREF_BUNDLE"
          test -f "$PREF_ENTRY"

          grep -q '<string>icon.png</string>' "$PREF_ENTRY"
          test -f "$PREF_BUNDLE/icon.png"
          test -f "$PREF_BUNDLE/icon@2x.png"
          test -f "$PREF_BUNDLE/icon@3x.png"
          ! test -e "$ROOT/Library/PreferenceLoader/Preferences/WAJetsamServiceExtensionFix.png"

          python3 - "$PREF_BUNDLE" <<'PY'
          import struct
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          expected = {
              root / 'icon.png': (29, 29),
              root / 'icon@2x.png': (58, 58),
              root / 'icon@3x.png': (87, 87),
          }
          for path, size in expected.items():
              data = path.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', path
              width, height = struct.unpack('>II', data[16:24])
              assert (width, height) == size, (path, width, height, size)
          PY

          test -x "$CONTROL_DIR/postinst"
          grep -q 'finish reboot' "$CONTROL_DIR/postinst"

          ! test -e "$DYLIB_DIR/WatusiServiceDiag.dylib"
          ! test -e "$DYLIB_DIR/WatusiServiceTrace.dylib"
          ! test -e "$ROOT/usr/bin/watusidiag-observer"
          ! test -e "$ROOT/usr/bin/watusidiag-report"
          ! test -e "$ROOT/usr/bin/watusidiag-status"
          ! test -e "$ROOT/usr/bin/watusidiag-collect"

          lipo "$DYLIB_DIR/WAJetsamServiceExtensionFix.dylib" -verify_arch arm64 arm64e
          lipo "$DYLIB_DIR/WatusiExpiryFix.dylib" -verify_arch arm64 arm64e
          shasum -a 256 "$DEB"

      - name: Upload compiled DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: WAJetsam-ServiceExtensionFix-rootless-DEB
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(awk '/^Version:/ {print $2}' control)
          TAG="v${VERSION}"
          DEB=$(find packages -type f -name '*.deb' | head -n 1)
          test -n "$DEB"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" \
              --target "${GITHUB_SHA}" \
              --title "WAJetsam-ServiceExtensionFix ${VERSION}" \
              --notes-file RELEASE_NOTES.md
          fi
