name: "Build WAJetsam-ServiceExtensionFix"

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: wajetsam-serviceextensionfix-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage checked-in Settings icons
        shell: bash
        run: |
          set -euo pipefail
          cp WAJetsamServiceExtensionFixPrefs/Resources/WAJetsamServiceExtensionFix*.png layout/Library/PreferenceLoader/Preferences/

      - name: Verify clean source
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^Package: com.551.wajetsamserviceextensionfix$' control
          grep -q '^Name: WAJetsam-ServiceExtensionFix$' control
          grep -q '^Version: 2.0.1$' control
          grep -q '^Homepage: https://github.com/551UK/WAJetsam-ServiceExtensionFix$' control
          grep -q '#define WAJ_TARGET_LIMIT_MB 40' WAJetsamPolicy.h
          grep -q 'checkExpiryDate' WatusiExpiryFix.m
          grep -q 'libWatusiTools' WatusiExpiryFix.m
          grep -q 'WEF_ARM64_BLR_X19' WatusiExpiryFix.m
          grep -q 'MSHookMemory' WatusiExpiryFix.m
          grep -q 'com.551.wajetsamserviceextensionfix' WatusiExpiryFix.m
          grep -q 'finish reboot' layout/DEBIAN/postinst
          grep -q 'GitHub Repository' WAJetsamServiceExtensionFixPrefs/WAJRootListController.m
          grep -q 'https://github.com/551UK/WAJetsam-ServiceExtensionFix' WAJetsamServiceExtensionFixPrefs/WAJRootListController.m
          ! grep -q 'WatusiExpiryFix.log' WatusiExpiryFix.m
          ! test -e Trace.m
          ! test -e observer.c
          ! test -e report.m
          ! test -e status.c
          ! test -e WatusiServiceFixPrefs
          ! test -e WatusiServiceDiag.plist
          ! test -e ExpiryFix.m
          ! test -e Tweak.x
          ! test -e libproc.h
          ! test -e policy.h
          ! test -e tests/test_policy.c
          plutil -lint WatusiExpiryFix.plist
          plutil -lint WAJetsamServiceExtensionFix.plist
          plutil -lint WAJetsamServiceExtensionFixPrefs/Info.plist
          plutil -lint layout/Library/PreferenceLoader/Preferences/WAJetsamServiceExtensionFix.plist
          grep -q '<string>WAJetsamServiceExtensionFixPrefs</string>' layout/Library/PreferenceLoader/Preferences/WAJetsamServiceExtensionFix.plist
          grep -q '<string>WAJRootListController</string>' layout/Library/PreferenceLoader/Preferences/WAJetsamServiceExtensionFix.plist
          grep -q '<string>WAJetsamServiceExtensionFix.png</string>' layout/Library/PreferenceLoader/Preferences/WAJetsamServiceExtensionFix.plist
          ! grep -q '<key>controller</key>' layout/Library/PreferenceLoader/Preferences/WAJetsamServiceExtensionFix.plist
          ! grep -q '<key>iconImage</key>' layout/Library/PreferenceLoader/Preferences/WAJetsamServiceExtensionFix.plist
          ! grep -q '/var/jb/' layout/Library/PreferenceLoader/Preferences/WAJetsamServiceExtensionFix.plist

      - name: Test 40 MB policy
        shell: bash
        run: |
          set -euo pipefail
          cc -Wall -Wextra -Werror tests/test_jetsam_policy.c -o "$RUNNER_TEMP/wajetsam-policy-test"
          "$RUNNER_TEMP/wajetsam-policy-test"

      - name: Install Theos
        uses: beerpiss/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks

      - name: Install Debian packaging tools
        run: brew install dpkg

      - name: Build rootless DEB
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .theos packages
          DPKG_WRAPPER="$RUNNER_TEMP/wajetsam-dpkg-deb"
          cat > "$DPKG_WRAPPER" <<'SH'
          #!/bin/sh
          exec dpkg-deb --root-owner-group "$@"
          SH
          chmod +x "$DPKG_WRAPPER"

          THEOS_PACKAGE_SCHEME=rootless make clean
          THEOS_PACKAGE_SCHEME=rootless \
          THEOS_PLATFORM_DEB_COMPRESSION_TYPE=gzip \
          THEOS_PLATFORM_DEB_COMPRESSION_LEVEL=6 \
          make package FINALPACKAGE=1 \
          _THEOS_PLATFORM_DPKG_DEB="$DPKG_WRAPPER"

          DEB=$(find packages -type f -name '*.deb' | head -n 1)
          test -n "$DEB"
          test "$(dpkg-deb -f "$DEB" Architecture)" = 'iphoneos-arm64'
          test "$(dpkg-deb -f "$DEB" Package)" = 'com.551.wajetsamserviceextensionfix'
          test "$(dpkg-deb -f "$DEB" Version)" = '2.0.1'
          test "$(dpkg-deb -f "$DEB" Name)" = 'WAJetsam-ServiceExtensionFix'

          VERIFY_DIR="$RUNNER_TEMP/wajetsam-package-check"
          CONTROL_DIR="$RUNNER_TEMP/wajetsam-control-check"
          rm -rf "$VERIFY_DIR" "$CONTROL_DIR"
          mkdir -p "$VERIFY_DIR" "$CONTROL_DIR"
          dpkg-deb -x "$DEB" "$VERIFY_DIR"
          dpkg-deb -e "$DEB" "$CONTROL_DIR"

          ROOT="$VERIFY_DIR/var/jb"
          test -f "$ROOT/Library/MobileSubstrate/DynamicLibraries/WAJetsamServiceExtensionFix.dylib"
          test -f "$ROOT/Library/MobileSubstrate/DynamicLibraries/WAJetsamServiceExtensionFix.plist"
          test -f "$ROOT/Library/MobileSubstrate/DynamicLibraries/WatusiExpiryFix.dylib"
          test -f "$ROOT/Library/MobileSubstrate/DynamicLibraries/WatusiExpiryFix.plist"
          test -d "$ROOT/Library/PreferenceBundles/WAJetsamServiceExtensionFixPrefs.bundle"
          test -f "$ROOT/Library/PreferenceLoader/Preferences/WAJetsamServiceExtensionFix.plist"
          test -f "$ROOT/Library/PreferenceLoader/Preferences/WAJetsamServiceExtensionFix.png"
          test -f "$ROOT/Library/PreferenceLoader/Preferences/WAJetsamServiceExtensionFix@2x.png"
          test -f "$ROOT/Library/PreferenceLoader/Preferences/WAJetsamServiceExtensionFix@3x.png"
          test -x "$CONTROL_DIR/postinst"
          grep -q 'finish reboot' "$CONTROL_DIR/postinst"

          python3 tests/verify_settings_icons.py "$ROOT"

          ! test -e "$ROOT/Library/MobileSubstrate/DynamicLibraries/WatusiServiceDiag.dylib"
          ! test -e "$ROOT/Library/MobileSubstrate/DynamicLibraries/WatusiServiceTrace.dylib"
          ! test -e "$ROOT/usr/bin/watusidiag-observer"
          ! test -e "$ROOT/usr/bin/watusidiag-report"
          ! test -e "$ROOT/usr/bin/watusidiag-status"
          ! test -e "$ROOT/usr/bin/watusidiag-collect"

          lipo "$ROOT/Library/MobileSubstrate/DynamicLibraries/WAJetsamServiceExtensionFix.dylib" -verify_arch arm64 arm64e
          lipo "$ROOT/Library/MobileSubstrate/DynamicLibraries/WatusiExpiryFix.dylib" -verify_arch arm64 arm64e
          shasum -a 256 "$DEB"

      - name: Upload compiled DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: WAJetsam-ServiceExtensionFix-rootless-DEB
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(awk '/^Version:/ {print $2}' control)
          TAG="v${VERSION}"
          DEB=$(find packages -type f -name '*.deb' | head -n 1)
          test -n "$DEB"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DEB" --clobber
          else
            gh release create "$TAG" "$DEB" \
              --target "${GITHUB_SHA}" \
              --title "WAJetsam-ServiceExtensionFix ${VERSION}" \
              --notes-file RELEASE_NOTES.md
          fi
